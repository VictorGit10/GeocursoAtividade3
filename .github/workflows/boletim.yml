name: boletim-clima

on:
  schedule:
    - cron: "0 12 * * *"    # 12h UTC = 9h em Brasília
  workflow_dispatch:         # botão "Run workflow" para rodar na hora, em aula
    inputs:
      dias_de_historico:
        description: >-
          Recuperar previsões antigas antes de gerar o boletim (0 = não
          recuperar). Use uma vez, para o histórico nascer cheio.
        required: false
        default: "0"

permissions:
  contents: write            # o robô precisa disso para commitar o boletim

# Se um disparo manual coincidir com o agendado, o segundo espera o primeiro.
# Sem isso, os dois mexeriam no mesmo CSV ao mesmo tempo.
concurrency:
  group: boletim-clima
  cancel-in-progress: false

jobs:
  boletim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests matplotlib

      - name: Passo 0 — recuperar previsões antigas (só quando pedido)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.dias_de_historico != '0'
        run: python montar_historico.py "${{ inputs.dias_de_historico }}"

      - name: Passo 1 — coletar a previsão de hoje e anotar no histórico
        run: python 1_coletar.py

      - name: Passo 2 — conferir as previsões antigas contra o que aconteceu
        run: python 2_conferir.py

      - name: Passo 3 — gerar os gráficos e escrever o boletim
        env:
          # Cadastre em Settings > Secrets and variables > Actions.
          # Sem o segredo o boletim sai igual, com texto automático.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python 3_boletim.py

      - name: Publicar o boletim no repositório
        run: |
          git config user.name  "robo"
          git config user.email "robo@users.noreply.github.com"
          git add dados graficos boletim.md boletim.html
          git commit -m "boletim $(date -u +%F)" || {
            echo "Nada mudou hoje — nada a commitar."
            exit 0
          }
          # O robô pode ter começado antes de outro push chegar. Rebase antes
          # de empurrar, senão o push é recusado e o dia fica sem boletim.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
